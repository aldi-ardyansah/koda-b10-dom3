<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Title</title>
</head>
<body>
    <script>
        function createLabel(text) {
            const label = document.createElement("span");
            label.textContent = text;
            return label;
        }

        function createInput(type = "text") {
            const input = document.createElement("input");
            input.type = type;
            return input;
        }

        function createBreak() {
            return document.createElement("br");
        }

        const labelName = createLabel("Siapa nama anda?");
        const inputName = createInput();

        const labelAge = createLabel("Berapa umur anda?");
        const inputAge = createInput("number");

        const labelGender = createLabel("Apa jenis kelamin anda?");

        const labelMale = createLabel("Laki-laki");
        const labelFemale = createLabel("Perempuan");

        const inputMale = createInput("radio");
        const inputFemale = createInput("radio");

        const labelSmoker = createLabel("Apakah anda perokok?");

        const labelYes = createLabel("Ya");
        const labelNo = createLabel("Tidak");

        const inputYes = createInput("radio");
        const inputNo = createInput("radio");

        const labelCigar = createLabel("Jika anda perokok, rokok apa yang pernah anda coba?");

        const labelCigar1 = createLabel("Gudang Garam Filter");
        const labelCigar2 = createLabel("Lucky Strike");
        const labelCigar3 = createLabel("Marlboro");
        const labelCigar4 = createLabel("Esse");

        const checkBox1 = createInput("checkbox");
        const checkBox2 = createInput("checkbox");
        const checkBox3 = createInput("checkbox");
        const checkBox4 = createInput("checkbox");

        const buttonSubmit = document.createElement("button");
        buttonSubmit.type = "submit";
        buttonSubmit.textContent = "Submit";

        const buttonReset = document.createElement("button");
        buttonReset.type = "reset";
        buttonReset.textContent = "Reset";

        const elements = [
            labelName, createBreak(), inputName, createBreak(),
            labelAge, createBreak(), inputAge, createBreak(),
            labelGender, createBreak(), labelMale, inputMale, labelFemale, inputFemale, createBreak(),
            labelSmoker, createBreak(), labelYes, inputYes, labelNo, inputNo, createBreak(),
            labelCigar, createBreak(),
            checkBox1, labelCigar1, createBreak(),
            checkBox2, labelCigar2, createBreak(),
            checkBox3, labelCigar3, createBreak(),
            checkBox4, labelCigar4, createBreak(),
            buttonSubmit, buttonReset
        ];

        elements.forEach(el => document.body.appendChild(el));
    </script>
</body>
</html>
